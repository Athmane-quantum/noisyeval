[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisyeval"
version = "0.1.0"
description = "Does AI-generated quantum code survive real hardware? A small, reproducible benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Athmane Mekhalfia" }]
dependencies = [
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
  "qiskit-ibm-runtime>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
